name: Update County Project Counts

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # Daily at 6am UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions tab

jobs:
  update-counties:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update county project counts
        env:
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
        run: python scripts/update_counties.py
