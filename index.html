<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<title>GBEP Focal Species</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;max-height:100vh;overflow:hidden;background:white;font-family:'Roboto',sans-serif;}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 12px 6px;}
.chart-title{font-size:15px;font-weight:700;color:#1a2332;margin-bottom:2px;flex-shrink:0;}
.chart-subtitle{font-size:12px;color:#64748b;margin-bottom:6px;flex-shrink:0;}
#sc{flex:1;min-height:0;position:relative;overflow:hidden;}
#tooltip{position:fixed;background:rgba(26,35,50,.92);color:white;padding:7px 10px;border-radius:6px;
  font-size:12px;pointer-events:none;z-index:9999;display:none;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap">
  <div class="chart-title">Projects by Focal Species</div>
  <div class="chart-subtitle">Each band represents the share of funded projects targeting that focal species. Hover for details.</div>
  <div id="sc"></div>
</div>
<div id="tooltip"></div>
<script>
var SURL="https://services2.arcgis.com/LYMgRMwHfrWWEg3s/arcgis/rest/services/survey123_6ce0c22f05d74de6bd806994a23cbc63_results/FeatureServer/0/query";
var tip=document.getElementById("tooltip");
function showTip(e,h){tip.innerHTML=h;tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px";}
function hideTip(){tip.style.display="none";}

var SLABELS={
  "invasive_species_control_eradic":"Invasive Species Control",
  "invasive species control eradic":"Invasive Species Control",
  "invasive species control/eradic":"Invasive Species Control",
  "invasive_species_control":"Invasive Species Control",
  "state_listed_species_species_of":"State Listed / SGC Need",
  "state listed species species of":"State Listed / SGC Need",
  "state_listed_species":"State Listed / SGC Need",
  "state listed species/species of":"State Listed / SGC Need",
  "state listed species/species":"State Listed / SGC Need",
  "endangered_threatened_species":"Endangered / Threatened",
  "endangered threatened species":"Endangered / Threatened",
  "endangered/threatened species":"Endangered / Threatened",
  "nongame_wildlife":"Nongame Wildlife",
  "nongame wildlife":"Nongame Wildlife",
  "no_focal_species_during_planning":"No Focal Species",
  "no focal species during planning":"No Focal Species",
  "no focal species":"No Focal Species"
};
var SICONS={
  "Nongame Wildlife":"ph-bird",
  "Endangered / Threatened":"ph-shield-star",
  "Invasive Species Control":"ph-prohibit",
  "State Listed / SGC Need":"ph-list-checks",
  "No Focal Species":"ph-minus-circle"
};
function getIcon(lbl){
  for(var k in SICONS)
    if(lbl.toLowerCase().indexOf(k.split(" ")[0].toLowerCase())>-1)return SICONS[k];
  return "ph-leaf";
}
function normS(s){
  var c=String(s).replace(/_/g," ").replace(/\s+/g," ").trim(), k=c.toLowerCase();
  if(SLABELS[k])return SLABELS[k];
  var kns=k.replace(/[\/\\]/g," ").replace(/\s+/g," ").trim();
  if(SLABELS[kns])return SLABELS[kns];
  for(var key in SLABELS){
    var kk=key.replace(/[\/\\]/g," ").replace(/\s+/g," ").trim();
    if(kns.indexOf(kk)===0||kk.indexOf(kns)===0)return SLABELS[key];
  }
  return c.replace(/\b\w/g,function(ch){return ch.toUpperCase();});
}
var COLORS=["#0d47a1","#1565c0","#1e8ec4","#29b6d3","#4dd0e1","#80deea","#b2ebf2"];

function draw(data){
  var el=document.getElementById("sc");
  el.innerHTML="";
  var W=el.clientWidth||500, H=el.clientHeight||340;
  if(W<50||H<50)return;

  // ── Data ───────────────────────────────────────────────────────────────────
  var funded=data.filter(function(d){
    return d.gbep_award_amount&&d.targeted_focal_species&&d.targeted_focal_species.trim();
  });
  var sk={},sl={};
  funded.forEach(function(row){
    row.targeted_focal_species.split(",").map(function(s){return s.trim();}).filter(Boolean)
    .forEach(function(raw){
      var norm=normS(raw), key=norm.toLowerCase().trim();
      if(key==="other"||key.indexOf("other targeted")===0||key.indexOf("other_targeted")===0){
        var desc=(row.targeted_focal_species_other||"").trim().replace(/_/g," ");
        var lbl=desc?"Other: "+desc:"Other", lk=lbl.toLowerCase();
        sk[lk]=(sk[lk]||0)+1; sl[lk]=lbl;
      } else { sk[key]=(sk[key]||0)+1; sl[key]=norm; }
    });
  });
  var counts=Object.keys(sk).map(function(k){return{label:sl[k],count:sk[k]};})
    .sort(function(a,b){return b.count-a.count;});
  if(!counts.length)return;
  var total=d3.sum(counts,function(d){return d.count;}), N=counts.length;

  // ── Layout ─────────────────────────────────────────────────────────────────
  // Circle radius at end of arms
  var CR   = Math.min(Math.floor(W*0.065), 34);
  // Drop radius — takes up centre third of width
  var DR   = Math.min(Math.floor((W - CR*4)*0.22), Math.floor(H*0.30), 90);
  var cx   = W/2;
  var topY = Math.max(8, CR);       // top tip of drop — leave room for top circle
  var bCy  = H - DR - Math.max(8, CR); // centre of bottom semicircle
  var dropH= bCy + DR - topY;

  // Arm height — thick enough to hold two lines of text comfortably
  var FS   = Math.max(11, Math.min(14, Math.floor(H/(N*2.3))));
  var ARM_H= Math.max(FS*2.6, Math.min(dropH/(N*0.9), 56));

  // Available width each side for arm (cx to edge minus circle)
  var ARM_W_L = cx - CR*2 - 8;   // left arm usable text width
  var ARM_W_R = W - cx - CR*2 - 8;

  // Drop path
  function hw(y){
    if(y>=bCy) return Math.sqrt(Math.max(0, DR*DR-(y-bCy)*(y-bCy)));
    return Math.max(0, DR*(y-topY)/(bCy-topY));
  }
  var dp="M"+cx+","+topY+" L"+(cx+DR)+","+bCy+" A"+DR+","+DR+" 0 0,1 "+(cx-DR)+","+bCy+" Z";

  var svg=d3.select("#sc").append("svg").attr("width",W).attr("height",H)
    .style("font-family","'Roboto',sans-serif").style("overflow","visible");
  var defs=svg.append("defs");
  defs.append("clipPath").attr("id","dc6").append("path").attr("d",dp);

  // ── Band geometry ──────────────────────────────────────────────────────────
  var layers=[];
  var cur=bCy+DR;
  counts.forEach(function(c,i){
    var pct=c.count/total, lh=pct*dropH, lt=cur-lh, midY=lt+lh/2;
    layers.push({
      label:c.label, count:c.count, pct:pct,
      top:lt, bot:cur, midY:midY, bandH:lh,
      edgeHW:hw(midY),
      color:COLORS[i%COLORS.length], right:i%2===0
    });
    cur=lt;
  });

  // ══ LAYER 1: Arms from CENTER of drop to box edge ══════════════════════════
  // Each arm is a full-width rect from cx (center) outward to the edge
  // The drop shadow + fill will cover the inner half, revealing only the outer arm
  layers.forEach(function(lay){
    var midY=lay.midY, aH=ARM_H;
    if(lay.right){
      // From center to right edge
      svg.append("rect")
        .attr("x", cx).attr("y", midY-aH/2)
        .attr("width", W-cx).attr("height", aH)
        .attr("fill", lay.color).attr("rx", 3);
    } else {
      // From left edge to center
      svg.append("rect")
        .attr("x", 0).attr("y", midY-aH/2)
        .attr("width", cx).attr("height", aH)
        .attr("fill", lay.color).attr("rx", 3);
    }
  });

  // ══ LAYER 2: Drop shadow — renders OVER arms creating 3D lift ══════════════
  svg.append("path").attr("d",dp)
    .attr("transform","translate(7,9)")
    .attr("fill","rgba(8,40,120,0.28)")
    .style("filter","blur(9px)");

  // ══ LAYER 3: Drop bands clipped to drop ════════════════════════════════════
  layers.forEach(function(lay){
    svg.append("rect")
      .attr("x",cx-DR-4).attr("y",lay.top)
      .attr("width",(DR+4)*2).attr("height",Math.max(lay.bot-lay.top,1))
      .attr("fill",lay.color).attr("clip-path","url(#dc6)");
    if(lay.top>topY+2){
      svg.append("line")
        .attr("x1",cx-DR).attr("x2",cx+DR)
        .attr("y1",lay.top).attr("y2",lay.top)
        .attr("stroke","rgba(255,255,255,0.45)").attr("stroke-width",2)
        .attr("clip-path","url(#dc6)");
    }
  });

  // ══ LAYER 4: Drop white outline ════════════════════════════════════════════
  svg.append("path").attr("d",dp).attr("fill","none")
    .attr("stroke","white").attr("stroke-width",3);

  // ══ LAYER 5: Icons inside drop (only when band tall enough) ════════════════
  var MIN_ICON=26;
  layers.forEach(function(lay){
    if(lay.bandH<MIN_ICON)return;
    var sz=Math.max(16,Math.min(lay.bandH*0.58,28));
    svg.append("foreignObject")
      .attr("x",cx-sz/2).attr("y",lay.midY-sz/2)
      .attr("width",sz+4).attr("height",sz+4)
      .append("xhtml:i")
        .attr("class","ph-bold "+getIcon(lay.label))
        .style("font-size",sz+"px")
        .style("color","rgba(255,255,255,0.92)")
        .style("display","flex")
        .style("align-items","center")
        .style("justify-content","center")
        .style("width",(sz+4)+"px")
        .style("height",(sz+4)+"px");
  });

  // ══ LAYER 6: Arm text + end circles ════════════════════════════════════════
  layers.forEach(function(lay){
    var midY=lay.midY;
    var edgeX=lay.edgeHW; // drop half-width at this band's midY

    // Text region: from drop edge outward, leaving room for circle
    var textPad=8;
    var textLeft, textRight, textW;
    if(lay.right){
      textLeft  = cx + edgeX + textPad;
      textRight = W - CR*2 - 12;
      textW     = textRight - textLeft;
    } else {
      textLeft  = CR*2 + 12;
      textRight = cx - edgeX - textPad;
      textW     = textRight - textLeft;
    }

    // Wrap label to fit available width
    var words=lay.label.split(/\s+/);
    var lines=[], cur2="";
    var chPerLine=Math.max(4,Math.floor(textW/(FS*0.56)));
    words.forEach(function(w){
      var test=cur2?cur2+" "+w:w;
      if(test.length>chPerLine&&cur2){lines.push(cur2);cur2=w;}
      else cur2=test;
    });
    if(cur2)lines.push(cur2);
    // Max 2 lines; truncate if more
    if(lines.length>2){lines=lines.slice(0,2);lines[1]=lines[1].slice(0,-1)+"\u2026";}

    var lh=FS*1.25;
    var textCx=lay.right?(textLeft+textRight)/2:(textLeft+textRight)/2;
    var startY=midY-((lines.length-1)*lh)/2;
    lines.forEach(function(line,li){
      svg.append("text")
        .attr("x",textCx).attr("y",startY+li*lh)
        .attr("text-anchor","middle").attr("dominant-baseline","middle")
        .attr("font-size",FS).attr("font-weight","700").attr("fill","white")
        .style("pointer-events","none")
        .text(line);
    });

    // End circle at box edge
    var cX=lay.right ? W-CR-4 : CR+4;
    // Shadow
    svg.append("circle").attr("cx",cX+2).attr("cy",midY+3).attr("r",CR)
      .attr("fill","rgba(0,0,0,0.13)").style("filter","blur(4px)");
    // White circle + colored ring
    svg.append("circle").attr("cx",cX).attr("cy",midY).attr("r",CR)
      .attr("fill","white").attr("stroke",lay.color).attr("stroke-width",3);
    svg.append("text").attr("x",cX).attr("y",midY)
      .attr("text-anchor","middle").attr("dominant-baseline","middle")
      .attr("font-size",Math.max(11,Math.round(CR*0.65))).attr("font-weight","900")
      .attr("fill",lay.color).style("pointer-events","none")
      .text(Math.round(lay.pct*100)+"%");

    // Hover zone over outer arm only (outside the drop)
    var hLeft =lay.right ? cx+edgeX      : cX-CR;
    var hRight=lay.right ? cX+CR         : cx-edgeX;
    svg.append("rect")
      .attr("x",hLeft).attr("y",midY-ARM_H/2-4)
      .attr("width",Math.max(0,hRight-hLeft)).attr("height",ARM_H+8)
      .attr("fill","transparent").style("cursor","pointer")
      .on("mousemove",function(ev){
        showTip(ev,"<strong>"+lay.label+"</strong><br>"+
          Math.round(lay.pct*100)+"% of projects — "+
          lay.count+" project"+(lay.count!==1?"s":""));
      })
      .on("mouseleave",hideTip);
  });
}

async function init(){
  var res=await fetch(SURL+"?where=gbep_award_amount+IS+NOT+NULL&outFields=*&f=json&resultRecordCount=2000");
  var d=await res.json();
  window._spd=d.features.map(function(f){return f.attributes;});
  requestAnimationFrame(function(){requestAnimationFrame(function(){draw(window._spd);});});
}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();
window.addEventListener("resize",function(){if(window._spd)draw(window._spd);});
</script>
</body>
</html>
