<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<title>GBEP Projects by Focal Species</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;max-height:100vh;overflow:hidden;background:white;font-family:'Roboto',sans-serif;}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 14px 8px;overflow:auto;}
.chart-title{font-size:15px;font-weight:700;color:#1a2332;margin-bottom:2px;}
.chart-subtitle{font-size:13px;color:#64748b;margin-bottom:8px;}
#species-chart{flex:1;min-height:200px;position:relative;overflow:visible;}
#tooltip{position:fixed;background:rgba(26,35,50,.92);color:white;padding:7px 10px;border-radius:6px;
  font-size:12px;font-family:'Roboto',sans-serif;pointer-events:none;z-index:9999;display:none;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap">
  <div class="chart-title">Projects by Focal Species</div>
  <div class="chart-subtitle">Each layer of the raindrop represents the percentage of funded projects that targeted each focal species. Hover a layer for details.</div>
  <div id="species-chart"></div>
</div>
<div id="tooltip"></div>
<script>
var FONT="'Roboto',sans-serif";
var SPE_PALETTE=["#1677bc","#0C6E56","#1D9E75","#006994","#00695c","#0d47a1","#1b5e20","#27ae60","#8e44ad","#e67e22"];
var URL="https://services2.arcgis.com/LYMgRMwHfrWWEg3s/arcgis/rest/services/survey123_6ce0c22f05d74de6bd806994a23cbc63_results/FeatureServer/0/query";
var tip=document.getElementById("tooltip");
function showTooltip(e,html){tip.innerHTML=html;tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY-8)+"px";}
function hideTooltip(){tip.style.display="none";}

var SPECIES_LABELS={
  "invasive_species_control_eradic":  "Invasive Species Control/Eradication",
  "invasive species control eradic":  "Invasive Species Control/Eradication",
  "invasive species control/eradic":  "Invasive Species Control/Eradication",
  "invasive_species_control":         "Invasive Species Control/Eradication",
  "state_listed_species_species_of":  "State Listed Species/Species of Greatest Conservation Need",
  "state listed species species of":  "State Listed Species/Species of Greatest Conservation Need",
  "state_listed_species":             "State Listed Species/Species of Greatest Conservation Need",
  "state listed species/species of":  "State Listed Species/Species of Greatest Conservation Need",
  "state listed species/species":     "State Listed Species/Species of Greatest Conservation Need",
  "endangered_threatened_species":    "Endangered/Threatened Species",
  "endangered threatened species":    "Endangered/Threatened Species",
  "endangered/threatened species":    "Endangered/Threatened Species",
  "nongame_wildlife":                 "Nongame Wildlife",
  "nongame wildlife":                 "Nongame Wildlife",
  "no_focal_species_during_planning": "No Focal Species During Planning",
  "no focal species during planning": "No Focal Species During Planning",
  "no focal species":                 "No Focal Species During Planning"
};

function normalizeSpecies(s){
  var clean=String(s).replace(/_/g," ").replace(/\s+/g," ").trim();
  var key=clean.toLowerCase();
  if(SPECIES_LABELS[key])return SPECIES_LABELS[key];
  var keyNoSlash=key.replace(/[\/\\]/g," ").replace(/\s+/g," ").trim();
  if(SPECIES_LABELS[keyNoSlash])return SPECIES_LABELS[keyNoSlash];
  for(var k in SPECIES_LABELS){
    var kNoSlash=k.replace(/[\/\\]/g," ").replace(/\s+/g," ").trim();
    if(keyNoSlash.indexOf(kNoSlash)===0||kNoSlash.indexOf(keyNoSlash)===0)return SPECIES_LABELS[k];
  }
  return clean.replace(/\b\w/g,function(c){return c.toUpperCase();});
}

function drawSpeciesChart(data){
  var el=document.getElementById("species-chart");
  el.innerHTML="";
  el.style.position="relative";
  var width=el.clientWidth||400,height=el.clientHeight||200;
  if(width<10||height<10)return;

  // ── Data ──────────────────────────────────────────────────────────────────
  var funded=data.filter(function(d){
    return d.gbep_award_amount&&d.targeted_focal_species&&d.targeted_focal_species.trim()!=="";
  });
  var sKey={},sLabel={};
  funded.forEach(function(row){
    row.targeted_focal_species.split(",")
      .map(function(s){return s.trim();}).filter(function(s){return s;})
      .forEach(function(raw){
        var norm=normalizeSpecies(raw);
        var key=norm.toLowerCase().trim();
        if(key==="other"||key==="other focal species"||
           key.indexOf("other_targeted")===0||key.indexOf("other targeted")===0){
          var desc=(row.targeted_focal_species_other||"").trim().replace(/_/g," ").replace(/\s+/g," ");
          var label=desc?"Other: "+desc:"Other";
          var labelKey=label.toLowerCase();
          sKey[labelKey]=(sKey[labelKey]||0)+1;
          sLabel[labelKey]=label;
        } else {
          sKey[key]=(sKey[key]||0)+1;
          sLabel[key]=norm;
        }
      });
  });
  var counts=Object.keys(sKey)
    .map(function(k){return{label:sLabel[k],count:sKey[k]};})
    .sort(function(a,b){return b.count-a.count;});
  if(!counts.length)return;
  var total=d3.sum(counts,function(d){return d.count;});

  // ── Layout ────────────────────────────────────────────────────────────────
  var CHIP_W=Math.min(width*0.52,260);
  var DROP_W=width-CHIP_W-8;
  var dropH=height-4;
  var r=Math.min(DROP_W*0.44,dropH*0.32,100);
  var cx=DROP_W/2;
  var topY=4;
  var bottomCy=topY+dropH-r-4;
  var dropBottom=bottomCy+r;
  var dropTotalH=dropBottom-topY;

  var dropPath="M "+cx+","+topY+
    " L "+(cx+r)+","+bottomCy+
    " A "+r+","+r+" 0 0 1 "+(cx-r)+","+bottomCy+" Z";

  // ── SVG ───────────────────────────────────────────────────────────────────
  var svg=d3.select("#species-chart").append("svg")
    .attr("width",DROP_W).attr("height",height)
    .style("position","absolute").style("left","0").style("top","0")
    .style("font-family",FONT).style("overflow","visible");

  svg.append("defs").append("clipPath").attr("id","spe-clip")
    .append("path").attr("d",dropPath);

  // Compute layer geometry first
  var layerMids=[],layerTops=[],layerHeights=[];
  var cur=dropBottom;
  counts.forEach(function(c){
    var lH=(c.count/total)*dropTotalH;
    var lT=cur-lH;
    layerTops.push(lT);
    layerMids.push(lT+lH/2);
    layerHeights.push(lH);
    cur=lT;
  });

  // Draw layers
  counts.forEach(function(c,i){
    svg.append("rect")
      .attr("x",cx-r-4).attr("y",layerTops[i])
      .attr("width",(r+4)*2).attr("height",layerHeights[i]+1)
      .attr("fill",SPE_PALETTE[i%SPE_PALETTE.length])
      .attr("clip-path","url(#spe-clip)");
    if(i<counts.length-1){
      svg.append("line")
        .attr("x1",cx-r-4).attr("x2",cx+r+4)
        .attr("y1",layerTops[i]).attr("y2",layerTops[i])
        .attr("stroke","white").attr("stroke-width",1.5)
        .attr("clip-path","url(#spe-clip)");
    }
  });

  // Drop outline
  svg.append("path").attr("d",dropPath).attr("fill","none")
    .attr("stroke","rgba(255,255,255,0.4)").attr("stroke-width",2);

  // Hover rects
  counts.forEach(function(c,i){
    var pct=c.count/total;
    svg.append("rect")
      .attr("x",cx-r-4).attr("y",layerTops[i])
      .attr("width",(r+4)*2).attr("height",Math.max(layerHeights[i],6))
      .attr("fill","transparent")
      .attr("clip-path","url(#spe-clip)")
      .style("cursor","pointer")
      .on("mousemove",function(event){
        showTooltip(event,"<strong>"+c.label+"</strong><br>"+
          Math.round(pct*100)+"% of projects<br>"+
          c.count+" project"+(c.count!==1?"s":""));
      })
      .on("mouseleave",hideTooltip);
  });

  // ── Evenly spaced chip positions matching raindrop order ─────────────────
  // counts[0] = largest = bottom of raindrop (high Y)
  // counts[N-1] = smallest = top of raindrop (low Y)
  // Chips spread evenly top→bottom in same order → no crossing lines
  var CHIP_H=36;
  var N=counts.length;
  var pad=CHIP_H/2+4;
  var pos=counts.map(function(c,i){
    // i=0 → bottom chip (largest), i=N-1 → top chip (smallest)
    // So position = height-pad going up to pad
    if(N===1) return height/2;
    return (height-pad) - i*((height-2*pad)/(N-1));
  });

  // ── Draw connectors + chips ───────────────────────────────────────────────
  var chipLeft=DROP_W+8;
  counts.forEach(function(c,i){
    var color=SPE_PALETTE[i%SPE_PALETTE.length];
    var pct=Math.round(c.count/total*100);
    var natY=layerMids[i];  // natural attachment point on drop
    var chipY=pos[i];       // resolved chip centre Y

    // Curved connector line
    var x0=cx+r+4;  // dot on drop edge
    var x1=chipLeft-2; // chip left edge
    svg.append("path")
      .attr("d","M "+x0+","+natY+
              " C "+(x0+20)+","+natY+
              " "+(x1-20)+","+chipY+
              " "+x1+","+chipY)
      .attr("fill","none")
      .attr("stroke",color)
      .attr("stroke-width",1.5)
      .attr("opacity",0.5);

    // Dot at drop attachment
    svg.append("circle")
      .attr("cx",x0).attr("cy",natY).attr("r",3.5)
      .attr("fill",color).attr("opacity",0.85);

    // Chip
    var chip=document.createElement("div");
    chip.style.cssText=
      "position:absolute;"+
      "left:"+chipLeft+"px;"+
      "top:"+(chipY-CHIP_H/2)+"px;"+
      "width:"+(CHIP_W-8)+"px;"+
      "min-height:"+CHIP_H+"px;"+
      "display:flex;align-items:center;gap:8px;"+
      "padding:5px 10px 5px 8px;"+
      "background:white;"+
      "border-left:5px solid "+color+";"+
      "border-radius:0 6px 6px 0;"+
      "box-shadow:0 1px 5px rgba(0,0,0,0.12);"+
      "box-sizing:border-box;cursor:pointer;";

    chip.innerHTML=
      '<div style="font-size:15px;font-weight:900;color:'+color+
        ';flex-shrink:0;line-height:1;min-width:34px;text-align:right;">'+pct+'%</div>'+
      '<div style="font-size:12px;font-weight:600;color:#334155;'+
        'line-height:1.3;word-break:break-word;flex:1;">'+c.label+'</div>';

    chip.addEventListener("mouseenter",function(e){
      showTooltip(e,"<strong>"+c.label+"</strong><br>"+
        pct+"% of projects<br>"+c.count+" project"+(c.count!==1?"s":""));
    });
    chip.addEventListener("mouseleave",hideTooltip);
    el.appendChild(chip);
  });
}

async function init(){
  var res=await fetch(URL+"?where=gbep_award_amount+IS+NOT+NULL&outFields=*&f=json&resultRecordCount=2000");
  var d=await res.json();
  window._data=d.features.map(function(f){return f.attributes;});
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      drawSpeciesChart(window._data);
    });
  });
}
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",init);
}else{
  init();
}
window.addEventListener("resize",function(){if(window._data)drawSpeciesChart(window._data);});
</script>
</body>
</html>
