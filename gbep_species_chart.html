<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<title>GBEP Focal Species</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;max-height:100vh;overflow:hidden;background:white;font-family:'Roboto',sans-serif;}
#wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px 12px 6px;}
.chart-title{font-size:clamp(12px,1.2vw,15px);font-weight:700;color:#1a2332;margin-bottom:2px;flex-shrink:0;}
.chart-subtitle{font-size:clamp(10px,0.9vw,12px);color:#64748b;margin-bottom:6px;flex-shrink:0;}
#sc{flex:1;min-height:0;position:relative;overflow:hidden;}
#tooltip{position:fixed;background:rgba(26,35,50,.92);color:white;padding:7px 10px;border-radius:6px;
  font-size:clamp(10px,0.9vw,12px);pointer-events:none;z-index:9999;display:none;line-height:1.5;}
</style>
</head>
<body>
<div id="wrap">
  <div class="chart-title">Projects by Focal Species</div>
  <div class="chart-subtitle">Each band represents the share of funded projects targeting that focal species. Hover for details.</div>
  <div id="sc"></div>
</div>
<div id="tooltip"></div>
<script>
var SURL="https://services2.arcgis.com/LYMgRMwHfrWWEg3s/arcgis/rest/services/survey123_6ce0c22f05d74de6bd806994a23cbc63_results/FeatureServer/0/query";
var tip=document.getElementById("tooltip");
function showTip(e,h){tip.innerHTML=h;tip.style.display="block";tip.style.left=(e.clientX+14)+"px";tip.style.top=(e.clientY-10)+"px";}
function hideTip(){tip.style.display="none";}

var SLABELS={
  "invasive_species_control_eradic":"Invasive Species Control/Eradication",
  "invasive species control eradic":"Invasive Species Control/Eradication",
  "invasive species control/eradic":"Invasive Species Control/Eradication",
  "invasive_species_control":"Invasive Species Control/Eradication",
  "state_listed_species_species_of":"State Listed Species/SGC Need",
  "state listed species species of":"State Listed Species/SGC Need",
  "state_listed_species":"State Listed Species/SGC Need",
  "state listed species/species of":"State Listed Species/SGC Need",
  "state listed species/species":"State Listed Species/SGC Need",
  "endangered_threatened_species":"Endangered/Threatened Species",
  "endangered threatened species":"Endangered/Threatened Species",
  "endangered/threatened species":"Endangered/Threatened Species",
  "nongame_wildlife":"Nongame Wildlife",
  "nongame wildlife":"Nongame Wildlife",
  "no_focal_species_during_planning":"No Focal Species During Planning",
  "no focal species during planning":"No Focal Species During Planning",
  "no focal species":"No Focal Species During Planning"
};
var SICONS={
  "Nongame Wildlife":"ph-bird",
  "Endangered/Threatened Species":"ph-shield-star",
  "Invasive Species Control/Eradication":"ph-prohibit",
  "State Listed Species/SGC Need":"ph-list-checks",
  "No Focal Species During Planning":"ph-minus-circle"
};
function getIcon(lbl){
  for(var k in SICONS)
    if(lbl.toLowerCase().indexOf(k.split(" ")[0].toLowerCase())>-1)return SICONS[k];
  return "ph-leaf";
}
function normS(s){
  var c=String(s).replace(/_/g," ").replace(/\s+/g," ").trim(), k=c.toLowerCase();
  if(SLABELS[k])return SLABELS[k];
  var kns=k.replace(/[\/\\]/g," ").replace(/\s+/g," ").trim();
  if(SLABELS[kns])return SLABELS[kns];
  for(var key in SLABELS){
    var kk=key.replace(/[\/\\]/g," ").replace(/\s+/g," ").trim();
    if(kns.indexOf(kk)===0||kk.indexOf(kns)===0)return SLABELS[key];
  }
  return c.replace(/\b\w/g,function(ch){return ch.toUpperCase();});
}
var COLORS=["#0d47a1","#1565c0","#1e8ec4","#29b6d3","#4dd0e1","#80deea","#b2ebf2"];

function draw(data){
  var el=document.getElementById("sc");
  el.innerHTML="";
  var W=el.clientWidth||500, H=el.clientHeight||340;
  if(W<50||H<50)return;

  // ── Data ───────────────────────────────────────────────────────────────────
  var funded=data.filter(function(d){
    return d.gbep_award_amount&&d.targeted_focal_species&&d.targeted_focal_species.trim();
  });
  var sk={},sl={};
  funded.forEach(function(row){
    row.targeted_focal_species.split(",").map(function(s){return s.trim();}).filter(Boolean)
    .forEach(function(raw){
      var norm=normS(raw), key=norm.toLowerCase().trim();
      if(key==="other"||key.indexOf("other targeted")===0||key.indexOf("other_targeted")===0){
        var desc=(row.targeted_focal_species_other||"").trim().replace(/_/g," ");
        var lbl=desc?"Other: "+desc:"Other", lk=lbl.toLowerCase();
        sk[lk]=(sk[lk]||0)+1; sl[lk]=lbl;
      } else { sk[key]=(sk[key]||0)+1; sl[key]=norm; }
    });
  });
  var counts=Object.keys(sk).map(function(k){return{label:sl[k],count:sk[k]};})
    .sort(function(a,b){return b.count-a.count;});
  if(!counts.length)return;
  var total=d3.sum(counts,function(d){return d.count;}), N=counts.length;

  // ── Layout ─────────────────────────────────────────────────────────────────
  var CR    = Math.min(Math.floor(W*0.068), 36);
  var DR    = Math.min(Math.floor((W-CR*4)*0.22), Math.floor(H*0.31), 92);
  var cx    = W/2;
  var topY  = Math.max(10, CR);
  var bCy   = H - DR - Math.max(10, CR);
  var dropH = bCy + DR - topY;

  // Font size — conservative cap so labels fit even at high browser zoom
  // (browser zoom shrinks the CSS-pixel container in ExB panels)
  var FS = Math.max(9, Math.min(12, Math.floor(Math.min(W * 0.022, H / (N * 2.5)))));
  // ARM_H — tall enough for 3-line labels; capped so bands don't visually overlap
  var ARM_H = Math.max(FS * 3.4, Math.min(dropH / (N * 0.80), 66));

  function hw(y){
    if(y>=bCy) return Math.sqrt(Math.max(0, DR*DR-(y-bCy)*(y-bCy)));
    return Math.max(0, DR*(y-topY)/(bCy-topY));
  }
  var dp="M"+cx+","+topY+" L"+(cx+DR)+","+bCy+" A"+DR+","+DR+" 0 0,1 "+(cx-DR)+","+bCy+" Z";

  // Build aria-label summary for screen readers
  var ariaDesc="Donut chart: Projects by Focal Species. "+
    counts.map(function(c){return c.label+" "+Math.round(c.count/total*100)+"%";}).join(", ")+".";

  var svg=d3.select("#sc").append("svg")
    .attr("width",W).attr("height",H)
    .attr("role","img")
    .attr("aria-label",ariaDesc)
    .style("font-family","'Roboto',sans-serif").style("overflow","visible");
  var defs=svg.append("defs");
  defs.append("clipPath").attr("id","dc7").append("path").attr("d",dp);

  // ── Band geometry ──────────────────────────────────────────────────────────
  var layers=[];
  var cur=bCy+DR;
  counts.forEach(function(c,i){
    var pct=c.count/total, lh=pct*dropH, lt=cur-lh, midY=lt+lh/2;
    layers.push({
      label:c.label, count:c.count, pct:pct,
      top:lt, bot:cur, midY:midY, bandH:lh,
      edgeHW:hw(midY),
      color:COLORS[i%COLORS.length], right:i%2===0
    });
    cur=lt;
  });

  // ══ LAYER 1: Arms ══════════════════════════════════════════════════════════
  layers.forEach(function(lay){
    var midY=lay.midY;
    if(lay.right){
      var armEnd=W-CR-4;
      svg.append("rect").attr("x",cx).attr("y",midY-ARM_H/2)
        .attr("width",Math.max(0,armEnd-cx)).attr("height",ARM_H)
        .attr("fill",lay.color).attr("rx",3);
    } else {
      var armStart=CR+4;
      svg.append("rect").attr("x",armStart).attr("y",midY-ARM_H/2)
        .attr("width",Math.max(0,cx-armStart)).attr("height",ARM_H)
        .attr("fill",lay.color).attr("rx",3);
    }
  });

  // ══ LAYER 2: Drop shadow ════════════════════════════════════════════════════
  svg.append("path").attr("d",dp)
    .attr("transform","translate(7,9)")
    .attr("fill","rgba(8,40,120,0.28)")
    .style("filter","blur(9px)");

  // ══ LAYER 3: Drop bands clipped ════════════════════════════════════════════
  layers.forEach(function(lay){
    svg.append("rect")
      .attr("x",cx-DR-4).attr("y",lay.top)
      .attr("width",(DR+4)*2).attr("height",Math.max(lay.bot-lay.top,1))
      .attr("fill",lay.color).attr("clip-path","url(#dc7)");
    if(lay.top>topY+2){
      svg.append("line")
        .attr("x1",cx-DR).attr("x2",cx+DR)
        .attr("y1",lay.top).attr("y2",lay.top)
        .attr("stroke","rgba(255,255,255,0.45)").attr("stroke-width",2)
        .attr("clip-path","url(#dc7)");
    }
  });

  // ══ LAYER 4: Drop white outline ════════════════════════════════════════════
  svg.append("path").attr("d",dp).attr("fill","none")
    .attr("stroke","white").attr("stroke-width",3);

  // ══ LAYER 5: Icons inside drop ═════════════════════════════════════════════
  // Centering fix: <div> flex wrapper around <i>.
  // Using line-height or flex directly on <i> is unreliable — icon fonts have
  // descender space that shifts the glyph off-center at zoom.
  var MIN_ICON=28;
  layers.forEach(function(lay,i){
    if(i===layers.length-1)return;
    if(lay.bandH<MIN_ICON)return;
    var sz=Math.round(Math.max(16,Math.min(lay.bandH*0.58,28)));
    var foSz=sz+10;
    var foX=Math.round(cx-foSz/2), foY=Math.round(lay.midY-foSz/2);
    svg.append("foreignObject")
      .attr("x",foX).attr("y",foY)
      .attr("width",foSz).attr("height",foSz)
      .append("xhtml:div")
        .style("display","flex").style("align-items","center")
        .style("justify-content","center").style("overflow","hidden")
        .style("width",foSz+"px").style("height",foSz+"px")
        .append("xhtml:i")
          .attr("class","ph-bold "+getIcon(lay.label))
          .style("font-size",sz+"px")
          .style("color","rgba(255,255,255,0.92)")
          .style("display","block").style("line-height","1")
          .style("flex-shrink","0");
  });

  // ══ LAYER 6: Arm labels ═════════════════════════════════════════════════════
  layers.forEach(function(lay){
    var midY=lay.midY;
    var textGap=6;
    var circGap=CR*2+10;
    var textX, textW, flexAlign, textAlign;

    if(lay.right){
      textX = cx + lay.edgeHW + textGap;
      textW = W - textX - circGap;
      // RIGHT-SIDE FIX: text right-aligned so it reads flush against the circle bubble
      flexAlign = "flex-end";
      textAlign = "right";
    } else {
      textX = circGap;
      textW = cx - lay.edgeHW - textGap - circGap;
      flexAlign = "flex-start";
      textAlign = "left";
    }
    textW = Math.max(20, textW);

    var fo=svg.append("foreignObject")
      .attr("x", textX)
      .attr("y", midY - ARM_H/2)
      .attr("width", textW)
      .attr("height", ARM_H);
    fo.append("xhtml:div")
      .style("width", textW+"px")
      .style("height", ARM_H+"px")
      .style("display","flex")
      .style("align-items","center")
      .style("justify-content", flexAlign)
      .style("overflow","hidden")
      .append("xhtml:span")
        .style("font-family","'Roboto',sans-serif")
        .style("font-size", FS+"px")
        .style("font-weight","700")
        .style("color","white")
        .style("line-height","1.25")
        .style("text-align", textAlign)
        // word-break:normal means only spaces cause line breaks, not "/" or "-"
        // overflow-wrap:anywhere is the last-resort fallback if a single word won't fit
        .style("word-break","normal")
        .style("overflow-wrap","anywhere")
        .style("white-space","normal")
        .style("max-height", ARM_H+"px")
        .style("overflow","hidden")
        // ZWS after "/" gives the browser a break opportunity at the slash
        // without adding visible space — fixes "Endangered/Threatened" splitting mid-word
        .text(lay.label.replace(/\//g,"/\u200b"));

    // End circle
    var cX = lay.right ? W-CR-4 : CR+4;
    svg.append("circle").attr("cx",cX+2).attr("cy",midY+3).attr("r",CR)
      .attr("fill","rgba(0,0,0,0.13)").style("filter","blur(4px)");
    svg.append("circle").attr("cx",cX).attr("cy",midY).attr("r",CR)
      .attr("fill","white").attr("stroke",lay.color).attr("stroke-width",3);
    svg.append("text").attr("x",cX).attr("y",midY)
      .attr("text-anchor","middle").attr("dominant-baseline","middle")
      .attr("font-size",Math.max(11,Math.round(CR*0.65))).attr("font-weight","900")
      .attr("fill",lay.color).style("pointer-events","none")
      .text(Math.round(lay.pct*100)+"%");

    // Hover zone — also keyboard accessible
    var hLeft  = lay.right ? cx+lay.edgeHW : cX-CR;
    var hRight = lay.right ? cX+CR         : cx-lay.edgeHW;
    svg.append("rect")
      .attr("x",hLeft).attr("y",midY-ARM_H/2-4)
      .attr("width",Math.max(0,hRight-hLeft)).attr("height",ARM_H+8)
      .attr("fill","transparent").style("cursor","pointer")
      .attr("tabindex","0")
      .attr("role","button")
      .attr("aria-label",lay.label+": "+Math.round(lay.pct*100)+"% of projects, "+lay.count+" project"+(lay.count!==1?"s":""))
      .on("mousemove",function(ev){
        var sgcNote = lay.label.indexOf("SGC") > -1
          ? "<br><span style='color:rgba(200,230,255,0.85);font-size:11px'>SGC = Species of Greatest Conservation Need</span>"
          : "";
        showTip(ev,"<strong>"+lay.label+"</strong><br>"+
          Math.round(lay.pct*100)+"% of projects — "+
          lay.count+" project"+(lay.count!==1?"s":"")+sgcNote);
      })
      .on("focus",function(ev){
        var sgcNote = lay.label.indexOf("SGC") > -1
          ? "<br><span style='color:rgba(200,230,255,0.85);font-size:11px'>SGC = Species of Greatest Conservation Need</span>"
          : "";
        showTip(ev,"<strong>"+lay.label+"</strong><br>"+
          Math.round(lay.pct*100)+"% of projects — "+
          lay.count+" project"+(lay.count!==1?"s":"")+sgcNote);
      })
      .on("blur",hideTip)
      .on("mouseleave",hideTip);
  });
}

async function init(){
  var res=await fetch(SURL+"?where=gbep_award_amount+IS+NOT+NULL&outFields=*&f=json&resultRecordCount=2000");
  var d=await res.json();
  window._spd=d.features.map(function(f){return f.attributes;});
  requestAnimationFrame(function(){requestAnimationFrame(function(){draw(window._spd);});});
}
document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();
window.addEventListener("resize",function(){if(window._spd)draw(window._spd);});
</script>
</body>
</html>
