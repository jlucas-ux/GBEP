<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .header {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      overflow: hidden;
    }
    .logo {
      width: auto;
      flex-shrink: 0;
      display: block;
    }
    .title-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.2;
    }
    .line1 {
      font-family: 'Roboto', sans-serif;
      font-weight: 900;
      color: #007ac2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .line2 {
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      color: #25b7d3;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" id="logo" src="https://jlucas-ux.github.io/GBEP/nru_logo.png" alt="NRU Logo">
    <div class="title-block">
      <span class="line1" id="l1">Galveston Bay</span>
      <span class="line2" id="l2">Habitat Project Database</span>
    </div>
  </div>
  <script>
    function scale() {
      var h = document.body.clientHeight || 100;
      document.getElementById('logo').style.height = h + 'px';
      document.getElementById('l1').style.fontSize = Math.round(h * 0.36) + 'px';
      document.getElementById('l2').style.fontSize = Math.round(h * 0.26) + 'px';
    }
    scale();
    window.addEventListener('resize', scale);
  </script>
</body>
</html>
